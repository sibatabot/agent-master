[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/client",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
agent-master-protocol = { path = "crates/protocol" }
agent-master-client = { path = "crates/client" }

anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
pty-process = { version = "0.5", features = ["async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.47"
vt100 = "0.16"
